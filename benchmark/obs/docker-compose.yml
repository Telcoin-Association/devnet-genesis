# =============================================================================
# bench-obs: the benchmark run's own metrics stack (benchmark/obs-lib.sh brings it up).
#
#   prometheus  remote-write receiver for the bench nodes' Alloy sidecars (POST /api/v1/write).
#               Published on the VM's VPC internal IP (OBS_BIND_IP, the nodes push there over
#               default-allow-internal) and on loopback (the bring-up's readiness poll and the
#               operator's IAP ssh forward). The admin API is on for the teardown's TSDB snapshot.
#   grafana     loopback only, reached through the operator's IAP ssh forward; anonymous Viewer.
#
# Metrics only: no Loki, no Caddy, no TLS, no DNS. Data lives on the obs-data disk at /mnt/obs-data.
# Variables come from /opt/obs/.env, written once by the bring-up (mode 600):
#   OBS_BIND_IP=<internal ip>  PROM_RETENTION=<e.g. 7d>  GF_ADMIN_PASSWORD=<random hex>
# =============================================================================
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-7d}
      - --web.enable-remote-write-receiver
      - --web.enable-admin-api
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/obs-data/prometheus:/prometheus
    ports:
      - "${OBS_BIND_IP:?OBS_BIND_IP must be set in .env}:9090:9090"
      - "127.0.0.1:9090:9090"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /mnt/obs-data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
