name: Benchmark harness checks

on:
  push:
    branches: [main, "feat/sigkill-*"]
  pull_request:
    paths: ["benchmark/**", ".github/workflows/recovery-checks.yml", "devnet-finalize.sh",
            "devnet-network-config.sh", "devnet-network-config.py", "devnet-lib.sh", "config.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BENCH_SHELL_SCRIPTS: >-
        benchmark/recovery-lib.sh benchmark/benchmark-blast.sh benchmark/node-sampler.sh
        benchmark/benchmark-teardown.sh benchmark/bench-lib.sh benchmark/benchmark-deploy.sh
        benchmark/config.sh benchmark/benchmark-firewall.sh benchmark/blaster-startup.sh
        benchmark/tools/latency-probe.sh benchmark/tools/params-apply.sh
        devnet-finalize.sh devnet-network-config.sh devnet-lib.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shell lint tool
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Shell syntax
        # bash -n checks only its first file argument, so one call per script.
        run: for f in ${BENCH_SHELL_SCRIPTS}; do echo "bash -n ${f}"; bash -n "${f}"; done
      - name: Shellcheck
        run: shellcheck -S warning ${BENCH_SHELL_SCRIPTS}
      - name: Python compile and 3.9 grammar
        run: |
          python3 -m py_compile benchmark/*.py benchmark/report/*.py benchmark/tests/*.py benchmark/tools/*.py devnet-network-config.py
          python3 -c "import ast,glob,sys; [ast.parse(open(f).read(), f, feature_version=(3,9)) for f in glob.glob('benchmark/report/*.py')+glob.glob('benchmark/tests/*.py')+glob.glob('benchmark/tools/*.py')+['devnet-network-config.py']]"
      - name: Unit tests (offline fixtures)
        run: python3 -m unittest discover -s benchmark/tests -v
      - name: Mutation checks
        run: python3 benchmark/tests/check_mutations.py
