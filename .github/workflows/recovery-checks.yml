name: Benchmark recovery capture

on:
  push:
    branches: [main, "feat/sigkill-*"]
  pull_request:
    paths: ["benchmark/**", ".github/workflows/recovery-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shell lint tool
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate shell and offline recovery fixtures
        run: |
          bash -n benchmark/benchmark-blast.sh benchmark/recovery-lib.sh benchmark/node-sampler.sh benchmark/benchmark-teardown.sh
          shellcheck -S warning benchmark/recovery-lib.sh benchmark/benchmark-blast.sh benchmark/node-sampler.sh benchmark/benchmark-teardown.sh
          python3 -m unittest discover -s benchmark/tests -v
          python3 benchmark/tests/check_mutations.py
